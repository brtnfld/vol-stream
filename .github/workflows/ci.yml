name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Build and smoke-test against HDF5 develop.
  #
  # Only develop is tracked -- older releases are not a support target, so the
  # matrix's job is catching drift against HEAD (H5VL_VERSION is 3 today and
  # will move again), not cross-version compatibility.
  #
  # This job already builds HDF5 with -DHDF5_ENABLE_PARALLEL=ON and installs
  # MPI (both legs of the matrix), so it is also where M6's collective-step /
  # parallel-writer test (ctest target "parallel") runs -- no separate job
  # needed, and it gets exercised against both mpich and openmpi for free,
  # matching this matrix's own rationale below about MPI implementations
  # differing in practice.
  # ---------------------------------------------------------------------------
  build:
    name: hdf5 ${{ matrix.hdf5 }} / ${{ matrix.mpi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - hdf5: develop
            mpi: mpich
          # Intercommunicator and dynamic-process behaviour differ between MPI
          # implementations in practice, so both are tested from the start.
          - hdf5: develop
            mpi: openmpi

    steps:
      - uses: actions/checkout@v4

      # Ubuntu's packaged MPICH (4.2.0 as of this runner image) hits a
      # CI-only bug: hydra_pmi_proxy configures each child's PMI bootstrap
      # correctly (confirmed via a diagnostic printout of PMI_RANK/SIZE/FD/
      # PORT from inside the child, before MPI_Init() runs -- see git log
      # for test/run_parallel_test.sh's own investigation, six-plus rounds
      # of mpiexec flags/env-vars), but the handshake itself silently fails
      # regardless of which of MPICH's two bootstrap mechanisms is used
      # (PMI_PORT: the child's connect() to the runner's own hostname:port
      # fails; PMI_FD: a pre-connected fork-inherited descriptor, also
      # fails, differently). Every rank then falls back to MPICH's
      # documented singleton-init behavior -- MPI_COMM_WORLD size 1, no
      # error, just silently wrong. This machine's own MPICH 5.0.0 (built
      # from source, same distro family) has never reproduced this in any
      # configuration tried, which is the signature of a version-specific
      # upstream bug rather than an environment/flag problem -- so build
      # MPICH 5.0.0 from source here instead of relying on the distro
      # package, sidestepping it entirely rather than continuing to chase
      # workarounds for 4.2.0's hydra.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          if [ "${{ matrix.mpi }}" = "mpich" ]; then
            curl -sSL https://www.mpich.org/static/downloads/5.0.0/mpich-5.0.0.tar.gz | tar xz
            cd mpich-5.0.0
            ./configure --prefix=/usr/local --with-device=ch3 --enable-shared --disable-fortran
            make -j"$(nproc)"
            sudo make install
            sudo ldconfig
            cd ..
            mpiexec --version
          else
            sudo apt-get install -y openmpi-bin libopenmpi-dev
          fi
          sudo apt-get install -y cmake ninja-build zlib1g-dev

      - name: Build HDF5 ${{ matrix.hdf5 }}
        run: |
          git clone --depth 1 --branch ${{ matrix.hdf5 }} \
            https://github.com/HDFGroup/hdf5.git hdf5-src
          cmake -S hdf5-src -B hdf5-build -G Ninja \
            -DCMAKE_INSTALL_PREFIX=$PWD/hdf5-install \
            -DCMAKE_BUILD_TYPE=Release \
            -DHDF5_ENABLE_PARALLEL=ON \
            -DBUILD_TESTING=ON \
            -DHDF5_TEST_API=ON \
            -DHDF5_BUILD_TOOLS=ON \
            -DHDF5_BUILD_EXAMPLES=OFF \
            -DHDF5_BUILD_FORTRAN=OFF \
            -DHDF5_BUILD_CPP_LIB=OFF
          cmake --build hdf5-build --parallel
          cmake --install hdf5-build

      - name: Report H5VL_VERSION
        run: |
          grep -E "define H5VL_VERSION" hdf5-install/include/H5VLpublic.h || true

      - name: Build vol-stream
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH=$PWD/hdf5-install \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DVOL_STREAM_H5DIFF=$PWD/hdf5-install/bin/h5diff
          cmake --build build --parallel

      - name: Smoke test
        run: ctest --test-dir build --output-on-failure

      # -----------------------------------------------------------------------
      # The M0 exit gate. Runs HDF5's own API suite natively and through the
      # connector and requires the two to be indistinguishable -- not merely
      # that the connector run passes, since a pass silently becoming a skip is
      # exactly the regression this is meant to catch.
      # -----------------------------------------------------------------------
      - name: API conformance gate
        run: |
          ./test/run_api_suite.sh \
            --api-bin  $PWD/hdf5-build/bin \
            --plugin-dir $PWD/build \
            --outdir  $PWD/api-results

      - name: Upload API suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-results-${{ matrix.hdf5 }}-${{ matrix.mpi }}
          path: api-results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # M4: Mercury transport, Margo progress, deferred I/O.
  # M5: SSG rendezvous and late joiners.
  # M7: queue policy and BAKE spill (M6 needs no transport -- it rides the
  # main `build` job's parallel HDF5 instead, see that job's own comment).
  # M8 (first increment): subscription protocol -- Mercury's first RPC
  # carrying actual payload bytes, not just control-plane scalars.
  #
  # mercury, argobots, mochi-margo, mochi-ssg, mochi-abt-io and mochi-bake are
  # not Ubuntu packages, so build them from source -- the exact versions and
  # configure flags verified locally: argobots 1.2, mercury 2.3.1 (+sm +ofi),
  # mochi-margo 0.17.0, mochi-ssg 0.5.4 (--disable-mpi --disable-pmix -- this
  # connector never co-launches writer and reader under one MPI job, so
  # neither is needed), mochi-abt-io 0.9.0, mochi-bake 0.6.4.
  #
  # PMDK 2.1.1 is a real, heavier dependency (BAKE's build hard-requires
  # libpmemobj) -- Ubuntu does not package a version new enough either, so it
  # is also built from source. NDCTL_ENABLE=n skips its libndctl/libdaxctl
  # RAS-hardware-failure-detection integration, which is irrelevant here:
  # BAKE's file backend (see the vol-stream build step below) never touches
  # real persistent-memory hardware, just a regular node-local file.
  # PMEMOBJ_IGNORE_DIRTY_SHUTDOWN/PMEMOBJ_IGNORE_BAD_BLOCKS are PMDK's own
  # required acknowledgment of that trade-off (the build fails without them
  # once NDCTL is off) -- see docs/dev-plan.md's M7 section and
  # src/tr_bake.c's file comment.
  #
  # CMAKE_POLICY_VERSION_MINIMUM=3.5 works around mercury's and flatcc's
  # cmake_minimum_required() predating what CMake 4 accepts -- the same
  # env-var escape hatch ../CMakeLists.txt uses for the vendored flatcc build.
  #
  # Only na+sm is exercised here (shared memory, needs no network setup);
  # ofi+tcp is part of the CI matrix table in dev-plan.md but not yet wired
  # up here.
  # ---------------------------------------------------------------------------
  m4-m7-transport:
    name: M4/M5/M7/M8 transport, rendezvous, queue policy, and subscription (na+sm)
    runs-on: ubuntu-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      PMEMOBJ_IGNORE_DIRTY_SHUTDOWN: "y"
      PMEMOBJ_IGNORE_BAD_BLOCKS: "y"
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev \
            libfabric-dev libjson-c-dev libboost-dev pkg-config autoconf automake libtool \
            uuid-dev pandoc

      - name: Build HDF5 develop
        run: |
          git clone --depth 1 --branch develop \
            https://github.com/HDFGroup/hdf5.git hdf5-src
          cmake -S hdf5-src -B hdf5-build -G Ninja \
            -DCMAKE_INSTALL_PREFIX=$PWD/hdf5-install \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DHDF5_BUILD_TOOLS=ON \
            -DHDF5_BUILD_EXAMPLES=OFF \
            -DHDF5_BUILD_FORTRAN=OFF \
            -DHDF5_BUILD_CPP_LIB=OFF
          cmake --build hdf5-build --parallel
          cmake --install hdf5-build

      - name: Build argobots 1.2
        run: |
          curl -sSL https://github.com/pmodels/argobots/releases/download/v1.2/argobots-1.2.tar.gz | tar xz
          cd argobots-1.2
          ./configure --prefix=$HOME/mochi-install
          make -j"$(nproc)" && make install

      - name: Build mercury 2.3.1
        run: |
          curl -sSL https://github.com/mercury-hpc/mercury/releases/download/v2.3.1/mercury-2.3.1.tar.bz2 | tar xj
          cmake -S mercury-2.3.1 -B mercury-build -G Ninja \
            -DCMAKE_INSTALL_PREFIX=$HOME/mochi-install \
            -DCMAKE_PREFIX_PATH=$HOME/mochi-install \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DNA_USE_SM=ON \
            -DNA_USE_OFI=ON \
            -DMERCURY_USE_BOOST_PP=ON
          cmake --build mercury-build --parallel
          cmake --install mercury-build

      - name: Build mochi-margo 0.17.0
        run: |
          curl -sSL https://github.com/mochi-hpc/mochi-margo/archive/v0.17.0.tar.gz | tar xz
          cd mochi-margo-0.17.0
          ./prepare.sh
          PKG_CONFIG_PATH=$HOME/mochi-install/lib/pkgconfig:$HOME/mochi-install/lib64/pkgconfig:$PKG_CONFIG_PATH \
            ./configure --prefix=$HOME/mochi-install
          make -j"$(nproc)" && make install

      - name: Build mochi-ssg 0.5.4
        run: |
          curl -sSL https://github.com/mochi-hpc/mochi-ssg/archive/refs/tags/v0.5.4.tar.gz | tar xz
          cd mochi-ssg-0.5.4
          ./prepare.sh
          PKG_CONFIG_PATH=$HOME/mochi-install/lib/pkgconfig:$HOME/mochi-install/lib64/pkgconfig:$PKG_CONFIG_PATH \
            ./configure --prefix=$HOME/mochi-install --disable-mpi --disable-pmix
          make -j"$(nproc)" && make install

      - name: Build PMDK 2.1.1
        run: |
          curl -sSL https://github.com/pmem/pmdk/archive/refs/tags/2.1.1.tar.gz | tar xz
          cd pmdk-2.1.1
          make -j"$(nproc)" NDCTL_ENABLE=n EXTRA_CFLAGS="-Wno-error" prefix=$HOME/mochi-install
          make install NDCTL_ENABLE=n EXTRA_CFLAGS="-Wno-error" prefix=$HOME/mochi-install

      - name: Build mochi-abt-io 0.9.0
        run: |
          curl -sSL https://github.com/mochi-hpc/mochi-abt-io/archive/refs/tags/v0.9.0.tar.gz | tar xz
          PKG_CONFIG_PATH=$HOME/mochi-install/lib/pkgconfig:$HOME/mochi-install/lib64/pkgconfig:$PKG_CONFIG_PATH \
            cmake -S mochi-abt-io-0.9.0 -B abt-io-build -G Ninja \
              -DCMAKE_INSTALL_PREFIX=$HOME/mochi-install \
              -DCMAKE_PREFIX_PATH=$HOME/mochi-install \
              -DCMAKE_BUILD_TYPE=Release \
              -DENABLE_BENCHMARK=OFF -DENABLE_EXAMPLES=OFF -DENABLE_TESTS=OFF \
              -DENABLE_LIBURING=OFF -DENABLE_BEDROCK=OFF
          cmake --build abt-io-build --parallel
          cmake --install abt-io-build

      - name: Build mochi-bake 0.6.4
        run: |
          curl -sSL https://github.com/mochi-hpc/mochi-bake/archive/refs/tags/v0.6.4.tar.gz | tar xz
          cd mochi-bake-0.6.4
          ./prepare.sh
          PKG_CONFIG_PATH=$HOME/mochi-install/lib/pkgconfig:$HOME/mochi-install/lib64/pkgconfig:$PKG_CONFIG_PATH \
            ./configure --prefix=$HOME/mochi-install
          make -j"$(nproc)" && make install

      - name: Build vol-stream with the transport
        run: |
          export PKG_CONFIG_PATH=$HOME/mochi-install/lib/pkgconfig:$HOME/mochi-install/lib64/pkgconfig:$PKG_CONFIG_PATH
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/hdf5-install;$HOME/mochi-install" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DVOL_STREAM_ENABLE_MERCURY=ON \
            -DVOL_STREAM_ENABLE_BAKE=ON \
            -DVOL_STREAM_H5DIFF=$PWD/hdf5-install/bin/h5diff
          cmake --build build --parallel

      - name: Test (Mercury round trip, SSG rendezvous, M7 queue policy, and M8 subscription, each as two processes)
        run: |
          LD_LIBRARY_PATH=$HOME/mochi-install/lib:$HOME/mochi-install/lib64:$LD_LIBRARY_PATH \
            ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Sanitizers. A background progress thread plus a step queue is the classic
  # place for races, so TSan is in the matrix before the queue exists rather
  # than after it misbehaves.
  #
  # Deliberately does not build with VOL_STREAM_ENABLE_MERCURY (Mercury is not
  # installed in this job, so CMakeLists.txt's AUTO detection leaves it off
  # regardless): Argobots' ucontext-based user-level threading has no TSan
  # fiber-switch annotations, so the moment it actually spins up an execution
  # stream, ThreadSanitizer segfaults trying to track a stack switch it
  # doesn't understand -- a tooling incompatibility, not a vol-stream race.
  # Confirmed locally: t_deferred (M4's other new code path, no Argobots
  # involved) passes clean under TSan; only t_transport/t_rendezvous crash,
  # and only under thread. The m4-m7-transport job above exercises the
  # transport (and M7's queue policy) instead, without sanitizers.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: ${{ matrix.san }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        san: [address, undefined, thread]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev

      # Ubuntu's libhdf5-dev is 1.10.10, below the 1.14 floor CMakeLists.txt
      # enforces, so find_package(HDF5) fails before the sanitizer build ever
      # starts. Build develop instead of relying on the system package --
      # same version the main matrix uses, since older releases aren't a
      # support target. HDF5_BUILD_TOOLS=ON so h5diff exists for t_replay.
      - name: Build HDF5 develop
        run: |
          git clone --depth 1 --branch develop \
            https://github.com/HDFGroup/hdf5.git hdf5-src
          cmake -S hdf5-src -B hdf5-build -G Ninja \
            -DCMAKE_INSTALL_PREFIX=$PWD/hdf5-install \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DHDF5_BUILD_TOOLS=ON \
            -DHDF5_BUILD_EXAMPLES=OFF \
            -DHDF5_BUILD_FORTRAN=OFF \
            -DHDF5_BUILD_CPP_LIB=OFF
          cmake --build hdf5-build --parallel
          cmake --install hdf5-build

      - name: Build with -fsanitize=${{ matrix.san }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH=$PWD/hdf5-install \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=${{ matrix.san }} -fno-omit-frame-pointer -g" \
            -DVOL_STREAM_H5DIFF=$PWD/hdf5-install/bin/h5diff
          cmake --build build --parallel

      - name: Smoke test
        run: ctest --test-dir build --output-on-failure
