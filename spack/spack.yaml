# Pinned development environment for vol-stream.
#
# Checked in from M0 so a build is reproducible and an upstream change shows up
# as a CI failure on the floating environment rather than as a broken install
# for a user. CI runs this pinned environment and a floating one; see
# .github/workflows/ci.yml.
#
#   spack env create vol-stream spack/spack.yaml
#   spack env activate vol-stream
#   spack install
#
# mercury, argobots and mochi-margo (M4) are builtin Spack packages. ssg (M5)
# and bake (M7) are not -- add the Mochi namespace first when those land:
#
#   git clone https://github.com/mochi-hpc/mochi-spack-packages
#   spack repo add mochi-spack-packages/spack_repo/mochi
#
# As of this writing that repo's package.py files use a newer Spack package
# API (spack_repo.builtin.build_systems imports) than Spack 0.23 supports --
# spack info/list on a package from it fails with "cannot unpack
# non-iterable NoneType object" on that version. If that bites, mochi-ssg
# builds cleanly from source instead (autotools: ./prepare.sh then
# ./configure --disable-mpi --disable-pmix against an already-installed
# margo), which is what .github/workflows/ci.yml's m4-transport job does.
#
spack:
  specs:
    # M0-M3: the connector needs only HDF5 itself.
    # HDF5_TEST_API is what produces the h5_api_test_* binaries the M0 exit
    # gate runs; without it there is nothing to compare against.
    - hdf5@develop +mpi +hl api_tests=true
    - mpich
    - cmake
    - pkgconf

    # M2: manifest framing. flatcc is FlatBuffers for C -- zero-copy reads and
    # real schema evolution, so adding the M8 predicate field later is a
    # compatible change rather than a format break. CMakeLists.txt falls back
    # to vendoring v0.6.1 via FetchContent when this isn't in the environment
    # -- pinned to the same version for behavioral parity either way.
    - flatcc@0.6.1

    # M4: transport and progress engine. na+sm is always built; ofi (libfabric)
    # covers the ofi+tcp CI leg.
    - mercury +sm +ofi
    - argobots
    - mochi-margo

    # M5: group membership. From the Mochi namespace -- not yet added, and
    # blocked on this environment by the package-API mismatch noted above.
    # - mochi-ssg

    # M7: queue spill to node-local storage.
    # - mochi-bake

  view: true
  concretizer:
    unify: true
